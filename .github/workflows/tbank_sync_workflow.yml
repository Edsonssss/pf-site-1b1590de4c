# .github/workflows/tbank_sync.yml
# Ежедневная выгрузка портфеля Т-Банк через T-Invest API.
#
# Токен лежит в СЕКРЕТАХ РЕПОЗИТОРИЯ (Actions secrets and variables):
#   Settings → Secrets and variables → Actions → вкладка Secrets →
#   New repository secret → Name: TB_TOKEN, Secret: <read-only токен>
# Секреты репозитория доступны всем workflow репозитория — строка
# environment у job НЕ нужна. (Если когда-нибудь захотите ограничить
# секрет одним job'ом — перенесите его в окружение и добавьте строку
# environment: tbank, скрипту и остальным шагам это безразлично.)
#
# TLS: у tbank.ru цепочка от корня Минцифры (Russian Trusted Root CA), которого
# нет в хранилище сертификатов раннеров GitHub — без него шаг выгрузки падал:
#   SSL: CERTIFICATE_VERIFY_FAILED ... self-signed certificate in certificate chain
# Корень и Sub CA теперь ВСТРОЕНЫ в сам скрипт (ssl_context() в
# fetch_tbank_portfolio.py), отпечаток корня сверяется при каждом запуске.
# Ничего доустанавливать в workflow не нужно. Если Т-Банк сменит цепочку —
# см. README_edit.md, раздел «Если workflow падает».
#
# Скрипт положите в репозиторий: scripts/fetch_tbank_portfolio.py
# Результат коммитится в корень репозитория как tbank_portfolio.json —
# на странице правок кнопка «⇄ Сверка с Т-Банком → ⤓ Взять с сайта»
# подхватит его автоматически. Если коммитить не хотите — удалите
# последний шаг, файл останется в артефактах сборки.

name: T-Bank portfolio sync

on:
  schedule:
    - cron: '20 5 * * *'        # ежедневно 08:20 МСК; только по будням: '20 5 * * 1-5'
  workflow_dispatch:             # запуск вручную из вкладки Actions

permissions:
  contents: write                # для коммита tbank_portfolio.json

jobs:
  fetch-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Выгрузить портфель через T-Invest API
        env:
          TB_TOKEN: ${{ secrets.TB_TOKEN }}   # Repository secrets
          # TB_ACCOUNT: '2000123456'   # раскомментируйте, если нужен КОНКРЕТНЫЙ
          #                             # счёт; иначе скрипт сам переберёт
          #                             # брокерские и возьмёт счёт с позициями
        run: |
          python scripts/fetch_tbank_portfolio.py --out tbank_portfolio.json

      - name: Загрузить артефакт (журнал выгрузки)
        uses: actions/upload-artifact@v4
        with:
          name: tbank_portfolio
          path: tbank_portfolio.json

      - name: Commit tbank_portfolio.json
        run: |
          git config user.name  "tbank-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tbank_portfolio.json
          git diff --cached --quiet || git commit -m "tbank portfolio snapshot $(date -u +%F)"
          git push

name: daily-update
on:
  schedule:
    - cron: '50 20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet openpyxl pyjwt cryptography
      - name: update data and site files
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: python auto_update.py
      - name: rebuild excel
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: python make_excel.py
      - name: commit and push
        run: |
          git config user.name "portfolio-auto"
          git config user.email "auto@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "daily update $(date -u +%F_%H%M)"; git push; fi
